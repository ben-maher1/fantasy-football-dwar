# Model fitting settings. Thresholds implement CLAUDE.md rule 5 (fail loudly).
seed: 20261024
first_season: 2006       # history window for fitting
positions: [QB, RB, WR, TE]  # one talent fit each
likelihood: sqrt_hurdle  # weekly points distribution and latent scale; see model/talent.py
likelihood_by_position:
  QB: sqrt_hurdle_log    # proportional drift; additive drift made QB forecasts too wide (step 5)
min_plays:               # weeks below this many plays (attempts + sacks + carries) are not fit
  QB: 15                 # drops injury exits and mop-up relief (about 14% of QB weeks)
situation_level:         # situation factors kept by validation (features/situation.py)
  QB: [qb_starter]       # QB1 on the preseason depth chart
  RB: [competition, vacated, rookie_capital]  # target and carry competition
situation_range: {}      # tested (changed team, new play-caller, new QB); none helped
sampler:
  chains: 4
  tune: 1000
  draws: 2000   # 1000 left the real WR fit borderline on R-hat (1.0115); 2000 gives 1.006
diagnostics:
  max_divergences: 0
  max_rhat: 1.01
  min_ess_bulk: 400
  min_ess_tail: 400
# Early-career terms (usage and early-career prior plan). Kept where they won
# on dev seasons; RB was a hair worse on both halves of dev, so it is left out.
# Opportunity points (`opportunity`, `opportunity_years`) were tested and
# made forecasts worse, for all seasons and for career years 1-2 only.
rookie_round1: [QB, WR, TE]  # first-round step in the rookie prior, beyond log pick
growth: [QB, WR, TE]         # lasting steps at career years 2 and 3, scaled by draft pick
# Game-by-game career model (plan "game-by-game career model and role
# context", ben 2026-11-05), WR only so far: recent form that fades within a
# season, and an offseason drift with the QB the player had last. Both beat
# the model without them on 2020-22 and on the 2023-25 holdout
# (validate/career.py, variant qb3).
# RBs too (ben, 2026-11-09): game-by-game RB model beat the season-level one
# in all four test periods (validate/career.py rb_career vs rb_base), with no
# QB drift for RBs.
game_steps: [WR, RB]
game_mode: form
qb_drift: [WR]
# Young WRs also take a lasting talent step after each game, fading out over
# about two seasons of games (ben, 2026-11-06). Better than without on
# 2020-22 (MAE +0.011) and 2023-25 (MAE +0.016) (validate/career.py "young").
young_steps: [WR, RB]
# RB usage (plan "game-by-game RB model and usage tests", ben 2026-11-09):
# carry share over the last 3 games and the change in snap share shift each
# game, from earlier games only. Better log score on 2017-19, 2020-22 and
# 2023-25 (rb_usage vs rb_career: +0.018, +0.019, +0.007).
usage: [RB]
draws_by_position:
  RB: 5000   # 3500 as validated (rb_usage); 2013-2026 fits just missed at 3500 (R-hat 1.012 h1) and 5000 (R-hat 1.0100 h0, hurdle terms); 7000 filled the disk
  WR: 4000   # the form decay rate mixes slowly (2000 draws: ESS ~320); young steps' size just missed R-hat at 3500
tune_by_position:
  RB: 2500   # longer tuning for the slow-mixing hurdle terms (h0, h1)
# The game-by-game WR model was validated on 2013 on (ben: fewer, recent
# years are fine); from 2006 its fit also runs out of memory (one form term
# per game).
first_season_by_position:
  WR: 2013
  RB: 2013   # the game-by-game RB model was validated from 2013
# The form decay rate mixed slowly in the 2013-2026 WR fit (one chain
# wandered off; R-hat 1.15), so it is held at the value the converged chains
# found (0.73-0.74; 0.76 on 2013-2022, 0.83 on 2013-2019).
form_rho:
  WR: 0.74
  RB: null   # estimated: RB fits put it near 0.27-0.29, stable across periods
