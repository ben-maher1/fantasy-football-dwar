# Value layer: talent -> DWAR (see src/dwar/value/dwar.py).
draws: 1000              # posterior draws carried through projection
horizon_seasons: 5       # full seasons after the current one, plus the rest of this one (ben, 2026-11-07: tested 5 out for WRs; was 3)
qb_fade: [WR]            # later seasons: WR QB-drift rating fades toward average (keeps ~26% a season on); ties carry-forward on tests, ben 2026-11-05
replacement_seasons: 3   # recent complete seasons whose player pool sets replacement level
pool_min_games: 4        # games for a player-season to count in that pool and in team-score SD
calibrate_spread: [QB]   # widen QB ranges by past misses (value/spread.py); step 5 found them too narrow
spread_factor:           # set from the latest backtest (validate summary "spread_factor")
  QB: 1.343              # 2012-2025 backtest of the situation-factor model (run F)
short_by_role: [QB]      # QB short-game chance by preseason role, QB1 or not (situation factors step)
games_hinge_quantile: 0.75  # games played stop rising with talent above the 75th percentile (injury step)
games_lagged_talent: true  # games model pairs games with last season's talent (injury step)
old_star:                # RBs 29+ off a 12+ PPG season: future seasons 75% toward last PPG x historical keep-rate (ben, 2026-11-10; reports/old_star)
  RB: {min_age: 29, min_ppg: 12, min_games: 8, weight: 0.75}
draft_survival: [RB]     # early-career draft terms in survival (validate/draft_avail.py: RB better 2013-22 and 2023-25)
draft_games: [RB, QB]    # ... and in games played (RB tie/better, QB better in both periods)
inactive_survival: [QB, RB, WR, TE]  # last season's healthy non-playing share (scratch, practice squad, unsigned) in survival (validate/inactive.py: better at every position 2013-22 and 2023-25; ben, 2026-11-12)
inactive_games: [QB, RB, WR, TE]     # ... and in games played (same)
starter_survival: []     # tested OFF (validate/starter.py, 2026-11-13): survival better 2013-22 but worse 2023-25
starter_games: [QB]      # last season's share of full games (15+ plays) and share x talent in games played (validate/starter.py: better 2013-22 and 2023-25; ben, 2026-11-13: backups should play few games)
late_pick: {}             # OFF (ben, 2026-11-10): round-3+ scaling cut productive late-round stars too hard; smoother fades no clearer win (reports/late_pick). Was RB: {min_round: 3, max_career_year: 3, min_ppg: 8, min_games: 8, factors: [1.0, 0.85, 0.80]}
survival_first_season: 1999  # survival trained on points per game since 1999, not fitted talent (2013+ for RB/WR): too few old players otherwise (validate/survival.py, 2026-11-10)
injury_history: true     # weeks missed to injury in the last two seasons + current injury status (injury step)
