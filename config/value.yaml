# Value layer: talent -> DWAR (see src/dwar/value/dwar.py).
draws: 1000              # posterior draws carried through projection
horizon_seasons: 10      # full seasons after the current one, plus the rest of this one (ben, 2026-11-24: 10 at 0.85 so later picks keep their careers; was 5 from 2026-11-07, 3 before)
qb_fade: [WR]            # later seasons: WR QB-drift rating fades toward average (keeps ~26% a season on); ties carry-forward on tests, ben 2026-11-05
replacement_seasons: 3   # recent complete seasons whose player pool sets replacement level
pool_min_games: 4        # games for a player-season to count in that pool and in team-score SD
calibrate_spread: [QB]   # widen QB ranges by past misses (value/spread.py); step 5 found them too narrow
spread_factor:           # set from the latest backtest (validate summary "spread_factor")
  QB: 1.343              # 2012-2025 backtest of the situation-factor model (run F)
short_by_role: [QB]      # QB short-game chance by preseason role, QB1 or not (situation factors step)
games_hinge_quantile: 0.75  # games played stop rising with talent above the 75th percentile (injury step)
games_lagged_talent: true  # games model pairs games with last season's talent (injury step)
old_star:                # RBs 29+ off a 12+ PPG season: future seasons 75% toward last PPG x historical keep-rate (ben, 2026-11-10; reports/old_star)
  RB: {min_age: 29, min_ppg: 12, min_games: 8, weight: 0.75}
draft_survival: [RB]     # early-career draft terms in survival (validate/draft_avail.py: RB better 2013-22 and 2023-25)
draft_games: [RB, QB]    # ... and in games played (RB tie/better, QB better in both periods)
inactive_survival: [QB, RB, WR, TE]  # last season's healthy non-playing share (scratch, practice squad, unsigned) in survival (validate/inactive.py: better at every position 2013-22 and 2023-25; ben, 2026-11-12)
inactive_games: [QB, RB, WR, TE]     # ... and in games played (same)
starter_survival: []     # tested OFF (validate/starter.py, 2026-11-13): survival better 2013-22 but worse 2023-25
starter_games: [QB]      # last season's share of full games (15+ plays) and share x talent in games played (validate/starter.py: better 2013-22 and 2023-25; ben, 2026-11-13: backups should play few games)
with_without: true       # value = lineup points a typical team loses without him, his spot refilled from waivers (bench covers byes/injuries first). ben, 2026-11-14: adopted on all tabs
full_games: [QB]         # QB value counts full games (15+ plays) from their own games model, so a backup's cameo appearances are not valued as starts (validate/starter.py full-games scores; 2026-11-13)
play_by_rank: 6          # rostered players play by depth rank (backups less), from next-season games of players ranked by last-season PPG, 6 recent seasons (ben, 2026-11-20; reports/title_value). 0 = one rate per position
qb_starters: 32          # >0: rostered QBs ranked 1..N are NFL starters (benched ones swapped out), playing at the top-12 rate; others never; no waiver QB (ben, 2026-11-21; adopted)
random_deal: true        # true: with-and-without rosters dealt at random each simulated week (a stud's team is no likelier to hold weak backups), not a snake (ben, 2026-11-21; adopted)
late_pick: {}             # OFF (ben, 2026-11-10): round-3+ scaling cut productive late-round stars too hard; smoother fades no clearer win (reports/late_pick). Was RB: {min_round: 3, max_career_year: 3, min_ppg: 8, min_games: 8, factors: [1.0, 0.85, 0.80]}
survival_first_season: 1999  # survival trained on points per game since 1999, not fitted talent (2013+ for RB/WR): too few old players otherwise (validate/survival.py, 2026-11-10)
injury_history: true     # weeks missed to injury in the last two seasons + current injury status (injury step)
picks:                   # rookie draft pick values (value/picks.py; plan approved by ben 2026-11-14)
  first_class: 2013      # NFL classes from here to the latest draft are the samples of draft-day credentials
  history_first: 2006    # rookie-season games/survival models learn from classes since (1999 tested 2026-11-19: a tie, reports/rb_history_prior)
  years: 3               # value the next 3 rookie drafts (2027-2029 as of 2026): the years Sleeper lets you hold (ben, 2026-11-24; was 5)
  prior_shape: true      # bend the rookie prior's log-pick line to the fit's own rookies: it overrated top-8 NFL picks, underrated picks 17-100 (2026-11-15)
  games_talent_corr: {QB: 0.30, RB: 0.30, WR: 0.33, TE: 0.20}  # rookie-year games go more to the better draws (corr. of fit talent and games given pick, 2013-24 rookies)
  talent_scale: {RB: 1.17}  # ben, 2026-11-15: one RB factor so 2013-21 classes' 5-season points match real (1.175; 1.13-1.22 leaving each class out). Hot-start RBs win playing time, which the model doesn't count
links:                   # league title-odds sim only (value/links.py): weekly draws linked within NFL games; DWAR unchanged (ben, 2026-11-24)
  mate:                  # correlation of weekly normal scores by role on one NFL team, 1999-2025 (QB-pass catcher + same-position: ben's choice, measured size)
    QB-RB1: 0.085
    QB-RB2: 0.040
    QB-WR1: 0.394
    QB-WR2: 0.320
    QB-WR3: 0.210
    QB-TE1: 0.277
    RB1-RB2: -0.087
    RB1-WR1: -0.009
    RB1-WR2: -0.019
    RB1-WR3: -0.040
    RB1-TE1: -0.018
    RB2-WR1: -0.023
    RB2-WR2: -0.019
    RB2-WR3: -0.005
    WR1-WR2: 0.013
    WR1-WR3: -0.017
    WR1-TE1: 0.004
    WR2-WR3: -0.019
    WR2-TE1: -0.009
    WR3-TE1: 0.008
  opp:                   # across the two teams of a game (passed 1999-2019 vs 2020-25; QB-QB log score +0.013 +- 0.004)
    QB-QB: 0.154
    QB-RB1: -0.011
    QB-RB2: -0.023
    QB-WR1: 0.084
    QB-WR2: 0.086
    QB-WR3: 0.065
    QB-TE1: 0.066
    RB1-RB1: -0.040
    RB1-RB2: -0.040
    RB1-WR3: 0.036
    RB1-TE1: 0.024
    RB2-RB2: -0.045
    RB2-WR1: -0.011
    RB2-WR3: 0.020
    WR1-WR1: 0.044
    WR1-WR2: 0.050
    WR1-WR3: 0.028
    WR1-TE1: 0.043
    WR2-WR2: 0.046
    WR2-WR3: 0.044
    WR2-TE1: 0.018
    WR3-WR3: 0.053
    WR3-TE1: 0.037
    TE1-TE1: 0.034
  handoffs:              # points vs expectation when a starter sits (1999-2025; both periods same sign)
    QB: {QB2: -0.130, RB1: -0.054, RB2: -0.142, WR1: -0.085, WR2: -0.096, WR3: -0.132, TE1: -0.077}
    RB1: {RB2: 0.226}
matchups:                # league title-odds sim only (value/league_odds.py), rest of the current season; DWAR unchanged (ben, 2026-11-23)
  byes: true             # NFL bye weeks are weeks out
  effects:               # weekly expected points x (1 + dvp * opponent rating + home * +-0.5); learned 2013-19, passed on 2020-25 weeks
    QB: {dvp: 0.349, home: 0.055}   # log score +0.011 +- 0.004 a week
    RB: {dvp: 0.510, home: 0.068}   # fantasy starters +0.007 +- 0.003 (all RBs a tie); WR, TE tie: left out
